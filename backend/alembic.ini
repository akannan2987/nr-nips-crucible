# Alembic configuration for the Crucible backend.
#
# The database URL is filled in by alembic/env.py from the DATABASE_URL
# environment variable (so the CLI and the app always agree). This file is
# used when running the `alembic` CLI from the backend/ directory, e.g.:
#
#     cd backend
#     DATABASE_URL=postgresql+psycopg://crucible:crucible@localhost:5432/crucible \
#         alembic upgrade head
#     alembic revision --autogenerate -m "describe change"
#     alembic check          # fail if models drift from migrations

[alembic]
script_location = alembic
prepend_sys_path = .
# Left blank on purpose — env.py sets it from DATABASE_URL.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
