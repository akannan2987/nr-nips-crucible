<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 940 440' width='940' height='440' role='img' aria-label='Three rungs from an open port to single sign-on: a token gate, local accounts, then the corporate identity provider; one feature flag; each rung keeps what the one below gave' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>
<rect x='0.5' y='0.5' width='939' height='439' rx='12' fill='#ffffff' stroke='#e5e7eb'/>
<defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#9ca3af'/></marker></defs>
<text x='470.0' y='34' font-size='16' fill='#1f2937' text-anchor='middle' font-weight='bold'>Authentication as a ladder: three rungs, one flag, single sign-on at the top</text>
<rect x='60' y='190' width='170' height='160' rx='10' fill='#ffffff' stroke='#9ca3af' stroke-width='1.2'/>
<text x='145' y='210' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>rung 0 · today</text>
<rect x='130.6' y='243.6' width='28.799999999999997' height='21.6' rx='3.5999999999999996' fill='#9ca3af' fill-opacity='0.18' stroke='#9ca3af' stroke-width='2'/>
<path d='M 149.79999999999998 243.6 V 235.2 A 8.399999999999999 8.399999999999999 0 0 1 166.6 235.2 V 243.6' fill='none' stroke='#9ca3af' stroke-width='2.4'/>
<text x='145' y='294' font-size='13' fill='#9ca3af' text-anchor='middle' font-weight='bold'>open port</text>
<text x='145' y='314' font-size='10' fill='#1f2937' text-anchor='middle' font-weight='normal'>HTTPS only</text>
<text x='145' y='328' font-size='10' fill='#1f2937' text-anchor='middle' font-weight='normal'>no login, nobody recorded</text>
<line x1='232' y1='270' x2='278' y2='230' stroke='#374151' stroke-width='1.6' marker-end='url(#arrow)'/>
<rect x='280' y='150' width='170' height='160' rx='10' fill='#ffffff' stroke='#d97706' stroke-width='1.2'/>
<text x='365' y='170' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>rung 1 · SH-3a</text>
<rect x='350.6' y='203.6' width='28.799999999999997' height='21.6' rx='3.5999999999999996' fill='#d97706' fill-opacity='0.18' stroke='#d97706' stroke-width='2'/>
<path d='M 356.6 203.6 V 195.2 A 8.399999999999999 8.399999999999999 0 0 1 373.4 195.2 V 203.6' fill='none' stroke='#d97706' stroke-width='2.4'/>
<text x='365' y='254' font-size='13' fill='#d97706' text-anchor='middle' font-weight='bold'>token gate</text>
<text x='365' y='274' font-size='10' fill='#1f2937' text-anchor='middle' font-weight='normal'>one shared secret</text>
<text x='365' y='288' font-size='10' fill='#1f2937' text-anchor='middle' font-weight='normal'>scripts use it forever</text>
<line x1='452' y1='230' x2='498' y2='190' stroke='#374151' stroke-width='1.6' marker-end='url(#arrow)'/>
<rect x='500' y='110' width='170' height='160' rx='10' fill='#ffffff' stroke='#0d9488' stroke-width='1.2'/>
<text x='585' y='130' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>rung 2 · SH-3b</text>
<rect x='570.6' y='163.6' width='28.799999999999997' height='21.6' rx='3.5999999999999996' fill='#0d9488' fill-opacity='0.18' stroke='#0d9488' stroke-width='2'/>
<path d='M 576.6 163.6 V 155.2 A 8.399999999999999 8.399999999999999 0 0 1 593.4 155.2 V 163.6' fill='none' stroke='#0d9488' stroke-width='2.4'/>
<text x='585' y='214' font-size='13' fill='#0d9488' text-anchor='middle' font-weight='bold'>local accounts</text>
<text x='585' y='234' font-size='10' fill='#1f2937' text-anchor='middle' font-weight='normal'>username + hashed password</text>
<text x='585' y='248' font-size='10' fill='#1f2937' text-anchor='middle' font-weight='normal'>roles: viewer · editor · admin</text>
<line x1='672' y1='190' x2='718' y2='150' stroke='#374151' stroke-width='1.6' marker-end='url(#arrow)'/>
<rect x='720' y='70' width='170' height='160' rx='10' fill='#ffffff' stroke='#4f46e5' stroke-width='1.2'/>
<text x='805' y='90' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>rung 3 · SH-3c</text>
<rect x='790.6' y='123.6' width='28.799999999999997' height='21.6' rx='3.5999999999999996' fill='#4f46e5' fill-opacity='0.18' stroke='#4f46e5' stroke-width='2'/>
<path d='M 796.6 123.6 V 115.2 A 8.399999999999999 8.399999999999999 0 0 1 813.4 115.2 V 123.6' fill='none' stroke='#4f46e5' stroke-width='2.4'/>
<text x='805' y='174' font-size='13' fill='#4f46e5' text-anchor='middle' font-weight='bold'>single sign-on</text>
<text x='805' y='194' font-size='10' fill='#1f2937' text-anchor='middle' font-weight='normal'>the corporate login vouches</text>
<text x='805' y='208' font-size='10' fill='#1f2937' text-anchor='middle' font-weight='normal'>no password held here</text>
<rect x='60' y='362' width='830' height='30' rx='6' fill='#f9fafb' stroke='#374151' stroke-width='1.2'/>
<text x='475' y='382' font-size='11' fill='#1f2937' text-anchor='middle' font-weight='bold' font-family='ui-monospace,Menlo,Consolas,monospace'>one flag, AUTH_MODE = off · token · local · sso — and one open route, /api/health, so the monitor keeps working</text>
<text x='470.0' y='412' font-size='11' fill='#1f2937' text-anchor='middle' font-weight='normal'>each rung keeps what the one below gave: tokens for scripts on every rung, a break-glass admin under single sign-on</text>
<text x='470.0' y='430' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>everyday version: fit a lock this week, keep the key for the cleaners, and install the badge reader when the badge office delivers</text>
</svg>
