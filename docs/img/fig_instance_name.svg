<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 940 420' width='940' height='420' role='img' aria-label='The three lines of the beta folder&apos;s .env.local fan out to the image, container, service unit, monitor log, cron line and address, all suffixed -beta or numbered 49161; production&apos;s file has no instance line and keeps the default names' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>
<rect x='0.5' y='0.5' width='939' height='419' rx='12' fill='#ffffff' stroke='#e5e7eb'/>
<defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#9ca3af'/></marker></defs>
<text x='470.0' y='34' font-size='15' fill='#1f2937' text-anchor='middle' font-weight='bold'>One file names everything: the instance name is a suffix, the port is a number, the code never knows the word</text>
<rect x='40' y='80' width='250' height='120' rx='10' fill='#f9fafb' stroke='#9ca3af' stroke-width='1.2'/>
<text x='165' y='104' font-size='12' fill='#1f2937' text-anchor='middle' font-weight='bold' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>.env.local  (in the beta folder)</text>
<text x='60' y='132' font-size='12' fill='#1f2937' text-anchor='start' font-weight='normal'>USE_HTTPS=true</text>
<text x='60' y='154' font-size='12' fill='#1f2937' text-anchor='start' font-weight='normal'>CRUCIBLE_INSTANCE=beta</text>
<text x='60' y='176' font-size='12' fill='#1f2937' text-anchor='start' font-weight='normal'>CRUCIBLE_PORT=49161</text>
<text x='165' y='214' font-size='9.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>untracked · gitignored · one per folder</text>
<path d='M 292 140 C 330 140, 330 96, 358 96' fill='none' stroke='#d97706' stroke-width='1.6' marker-end='url(#arrow)'/>
<rect x='360' y='84' width='540' height='26' rx='6' fill='#ffffff' stroke='#d97706' stroke-width='1.2'/>
<text x='372' y='101' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal'>image</text>
<text x='470' y='101' font-size='11' fill='#1f2937' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>crucible-py-beta:latest</text>
<path d='M 292 140 C 330 140, 330 130, 358 130' fill='none' stroke='#d97706' stroke-width='1.6' marker-end='url(#arrow)'/>
<rect x='360' y='118' width='540' height='26' rx='6' fill='#ffffff' stroke='#d97706' stroke-width='1.2'/>
<text x='372' y='135' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal'>container</text>
<text x='470' y='135' font-size='11' fill='#1f2937' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>crucible-py-beta</text>
<path d='M 292 140 C 330 140, 330 164, 358 164' fill='none' stroke='#d97706' stroke-width='1.6' marker-end='url(#arrow)'/>
<rect x='360' y='152' width='540' height='26' rx='6' fill='#ffffff' stroke='#d97706' stroke-width='1.2'/>
<text x='372' y='169' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal'>service unit</text>
<text x='470' y='169' font-size='11' fill='#1f2937' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>container-crucible-py-beta.service</text>
<path d='M 292 140 C 330 140, 330 198, 358 198' fill='none' stroke='#d97706' stroke-width='1.6' marker-end='url(#arrow)'/>
<rect x='360' y='186' width='540' height='26' rx='6' fill='#ffffff' stroke='#d97706' stroke-width='1.2'/>
<text x='372' y='203' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal'>monitor log</text>
<text x='470' y='203' font-size='11' fill='#1f2937' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>/tmp/crucible-monitor-beta.log</text>
<path d='M 292 140 C 330 140, 330 232, 358 232' fill='none' stroke='#d97706' stroke-width='1.6' marker-end='url(#arrow)'/>
<rect x='360' y='220' width='540' height='26' rx='6' fill='#ffffff' stroke='#d97706' stroke-width='1.2'/>
<text x='372' y='237' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal'>cron line</text>
<text x='470' y='237' font-size='10.5' fill='#1f2937' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>CONTAINER_NAME=crucible-py-beta  API_URL=https://…:49161/api/stats</text>
<path d='M 292 140 C 330 140, 330 266, 358 266' fill='none' stroke='#d97706' stroke-width='1.6' marker-end='url(#arrow)'/>
<rect x='360' y='254' width='540' height='26' rx='6' fill='#ffffff' stroke='#d97706' stroke-width='1.2'/>
<text x='372' y='271' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal'>address</text>
<text x='470' y='271' font-size='11' fill='#1f2937' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>https://&lt;vm-hostname&gt;:49161</text>
<rect x='40' y='250' width='250' height='70' rx='10' fill='#eef2ff' stroke='#4f46e5' stroke-width='1.2'/>
<text x='165' y='274' font-size='12' fill='#4f46e5' text-anchor='middle' font-weight='bold' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>production&apos;s .env.local</text>
<text x='165' y='296' font-size='11' fill='#1f2937' text-anchor='middle' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>USE_HTTPS=true   (no instance, no port)</text>
<text x='165' y='312' font-size='9.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>so: crucible-py · 49160 · container-crucible-py.service</text>
<rect x='360' y='300' width='540' height='44' rx='6' fill='#f9fafb' stroke='#9ca3af' stroke-width='1.2'/>
<text x='630' y='318' font-size='9.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>shared on purpose: the same scripts, the same image recipe, the same certificate (it names the host, not the port)</text>
<text x='630' y='334' font-size='9.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>separate on purpose: data/, backups/, the container, the image, the unit, the monitor line</text>
<text x='470.0' y='380' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>everyday version: two identical uniforms; the name tag says which kitchen you cook in,</text>
<text x='470.0' y='398' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>and the tag is pinned on the folder, not sewn into the cloth</text>
</svg>
