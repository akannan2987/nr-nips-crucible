<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 940 560' width='940' height='560' role='img' aria-label='Local accounts: a person signs in with a username and password, a script with a personal token; both are checked against one users table holding hashes, not secrets; the browser is remembered by a signed, sliding cookie; three roles decide what each may do' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>
<rect x='0.5' y='0.5' width='939' height='559' rx='12' fill='#ffffff' stroke='#e5e7eb'/>
<defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#9ca3af'/></marker></defs>
<text x='470.0' y='34' font-size='16' fill='#1f2937' text-anchor='middle' font-weight='bold'>Local accounts (SH-3b): who you are, checked against one table, remembered by a signed note</text>
<rect x='30' y='66' width='250' height='118' rx='10' fill='#eef2ff' stroke='#4f46e5' stroke-width='1.2'/>
<circle cx='70' cy='108.1' r='7.04' fill='#4f46e5' fill-opacity='0.18' stroke='#4f46e5' stroke-width='2'/>
<path d='M 54.6 131.2 A 15.399999999999999 15.399999999999999 0 0 1 85.4 131.2 Z' fill='#4f46e5' fill-opacity='0.18' stroke='#4f46e5' stroke-width='2'/>
<text x='175' y='92' font-size='12' fill='#4f46e5' text-anchor='middle' font-weight='bold'>a person, in the browser</text>
<text x='175' y='112' font-size='10' fill='#1f2937' text-anchor='middle' font-weight='normal'>username + password, once</text>
<text x='175' y='127' font-size='10' fill='#1f2937' text-anchor='middle' font-weight='normal'>POST /api/auth/login</text>
<text x='175' y='142' font-size='10' fill='#1f2937' text-anchor='middle' font-weight='normal'>then the cookie, every request</text>
<rect x='30' y='200' width='250' height='118' rx='10' fill='#f0fdf4' stroke='#0d9488' stroke-width='1.2'/>
<text x='155' y='226' font-size='12' fill='#0d9488' text-anchor='middle' font-weight='bold'>a script, or curl</text>
<text x='155' y='246' font-size='10' fill='#1f2937' text-anchor='middle' font-weight='normal'>a personal token, every request</text>
<text x='155' y='261' font-size='10' fill='#1f2937' text-anchor='middle' font-weight='normal'>Authorization: Bearer alice:…</text>
<text x='155' y='276' font-size='10' fill='#1f2937' text-anchor='middle' font-weight='normal'>issued by name, revoked by name</text>
<line x1='282' y1='125' x2='336' y2='200' stroke='#4f46e5' stroke-width='1.6' marker-end='url(#arrow)'/>
<line x1='282' y1='259' x2='336' y2='240' stroke='#0d9488' stroke-width='1.6' marker-end='url(#arrow)'/>
<rect x='340' y='150' width='260' height='170' rx='12' fill='#fffbeb' stroke='#d97706' stroke-width='1.2'/>
<rect x='359.2' y='182.2' width='21.599999999999998' height='16.2' rx='2.6999999999999997' fill='#d97706' fill-opacity='0.18' stroke='#d97706' stroke-width='2'/>
<path d='M 363.7 182.2 V 175.9 A 6.3 6.3 0 0 1 376.3 175.9 V 182.2' fill='none' stroke='#d97706' stroke-width='2.4'/>
<text x='470' y='176' font-size='12' fill='#d97706' text-anchor='middle' font-weight='bold' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>require_user</text>
<text x='470' y='200' font-size='9.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>password → Argon2 verify (slow on purpose)</text>
<text x='470' y='215' font-size='9.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>token → SHA-256, compared in constant time</text>
<text x='470' y='230' font-size='9.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>cookie → signature and age checked</text>
<text x='470' y='245' font-size='9.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>then: is the account still enabled?</text>
<text x='470' y='260' font-size='9.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>then: does the role allow this verb?</text>
<text x='470' y='306' font-size='9.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>401 if no · 403 if the role says no · else the answer</text>
<rect x='640' y='96' width='270' height='224' rx='10' fill='#ffffff' stroke='#9ca3af' stroke-width='1.2'/>
<text x='775' y='120' font-size='12.5' fill='#1f2937' text-anchor='middle' font-weight='bold' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>the users table</text>
<text x='652' y='142' font-size='9.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>username</text>
<text x='898' y='142' font-size='9.5' fill='#d97706' text-anchor='end' font-weight='bold' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>alice</text>
<text x='652' y='161' font-size='9.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>display_name</text>
<text x='898' y='161' font-size='9.5' fill='#1f2937' text-anchor='end' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>Alice Smith</text>
<text x='652' y='180' font-size='9.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>role</text>
<text x='898' y='180' font-size='9.5' fill='#d97706' text-anchor='end' font-weight='bold' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>editor</text>
<text x='652' y='199' font-size='9.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>enabled</text>
<text x='898' y='199' font-size='9.5' fill='#d97706' text-anchor='end' font-weight='bold' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>true</text>
<text x='652' y='218' font-size='9.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>password_hash</text>
<text x='898' y='218' font-size='9.5' fill='#1f2937' text-anchor='end' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>$argon2id$… (one-way)</text>
<text x='652' y='237' font-size='9.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>password_version</text>
<text x='898' y='237' font-size='9.5' fill='#1f2937' text-anchor='end' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>3</text>
<text x='652' y='256' font-size='9.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>token_hash</text>
<text x='898' y='256' font-size='9.5' fill='#1f2937' text-anchor='end' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>sha256(…) or null</text>
<text x='652' y='275' font-size='9.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>failed_attempts / locked_until</text>
<text x='898' y='275' font-size='9.5' fill='#1f2937' text-anchor='end' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>0 / null</text>
<text x='652' y='294' font-size='9.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>last_login</text>
<text x='898' y='294' font-size='9.5' fill='#1f2937' text-anchor='end' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>2026-09-23T08:41</text>
<line x1='602' y1='235' x2='638' y2='235' stroke='#d97706' stroke-width='1.6' marker-end='url(#arrow)'/>
<text x='775' y='312' font-size='8.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>never returned by the API, never readable in the query console</text>
<rect x='30' y='346' width='880' height='84' rx='10' fill='#eef2ff' stroke='#4f46e5' stroke-width='1.2'/>
<text x='470' y='370' font-size='12' fill='#4f46e5' text-anchor='middle' font-weight='bold'>the session cookie, crucible_session: signed, timestamped, not secret</text>
<text x='470' y='392' font-size='10' fill='#1f2937' text-anchor='middle' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>{ u: "alice", v: 3 } + issued-at + signature(SESSION_SECRET)   ·   HttpOnly · SameSite=Lax · Secure on HTTPS</text>
<text x='470' y='412' font-size='10' fill='#1f2937' text-anchor='middle' font-weight='normal'>valid ten hours from the LAST request (it slides); a reset password moves v and voids it; a disabled account is refused on the next click</text>
<rect x='30' y='448' width='880' height='56' rx='8' fill='#f9fafb' stroke='#374151' stroke-width='1.2'/>
<path d='M 76.0 460.8 Q 80 456.0 84.0 460.8' fill='none' stroke='#9ca3af' stroke-width='2'/>
<rect x='68.8' y='466.4' width='22.4' height='17.6' rx='1.92' fill='#9ca3af' fill-opacity='0.16' stroke='#9ca3af' stroke-width='2'/>
<rect x='72.8' y='464.0' width='14.4' height='2.88' rx='0.8' fill='#9ca3af'/>
<text x='80' y='478.4' font-size='6.72' fill='#9ca3af' text-anchor='middle' font-weight='bold'>V</text>
<text x='108' y='472' font-size='11.5' fill='#9ca3af' text-anchor='start' font-weight='bold'>viewer</text>
<text x='108' y='490' font-size='10' fill='#1f2937' text-anchor='start' font-weight='normal'>read · export · query</text>
