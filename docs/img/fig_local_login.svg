<rect x='358.8' y='466.4' width='22.4' height='17.6' rx='1.92' fill='#0d9488' fill-opacity='0.16' stroke='#0d9488' stroke-width='2'/>
<rect x='362.8' y='464.0' width='14.4' height='2.88' rx='0.8' fill='#0d9488'/>
<text x='370' y='478.4' font-size='6.72' fill='#0d9488' text-anchor='middle' font-weight='bold'>E</text>
<text x='398' y='472' font-size='11.5' fill='#0d9488' text-anchor='start' font-weight='bold'>editor</text>
<text x='398' y='490' font-size='10' fill='#1f2937' text-anchor='start' font-weight='normal'>+ upload · link · edit</text>
<path d='M 656.0 460.8 Q 660 456.0 664.0 460.8' fill='none' stroke='#4f46e5' stroke-width='2'/>
<rect x='648.8' y='466.4' width='22.4' height='17.6' rx='1.92' fill='#4f46e5' fill-opacity='0.16' stroke='#4f46e5' stroke-width='2'/>
<rect x='652.8' y='464.0' width='14.4' height='2.88' rx='0.8' fill='#4f46e5'/>
<text x='660' y='478.4' font-size='6.72' fill='#4f46e5' text-anchor='middle' font-weight='bold'>A</text>
<text x='688' y='472' font-size='11.5' fill='#4f46e5' text-anchor='start' font-weight='bold'>admin</text>
<text x='688' y='490' font-size='10' fill='#1f2937' text-anchor='start' font-weight='normal'>+ delete · merge · clear · the accounts</text>
<text x='470.0' y='530' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>everyday version: reception keeps a list of names with a fingerprint of each key, not the key; your visitor sticker is stamped, dated, and renewed while you are in the building</text>
<text x='470.0' y='548' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>docs/13-authentication.md, rung 2 · backend/app/accounts.py · manage_users.py inside the container</text>
