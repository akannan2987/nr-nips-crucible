<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 940 470' width='940' height='470' role='img' aria-label='The authoring folder on the development machine pushes to the public repository; the VM&apos;s mirror folder fetches public and pushes private; the beta folder pulls beta and the production folder pulls master from private' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>
<rect x='0.5' y='0.5' width='939' height='469' rx='12' fill='#ffffff' stroke='#e5e7eb'/>
<defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#9ca3af'/></marker></defs>
<text x='470.0' y='34' font-size='16' fill='#1f2937' text-anchor='middle' font-weight='bold'>Two repositories, four folders — content flows public → private only</text>
<rect x='30' y='70' width='250' height='130' rx='10' fill='#f9fafb' stroke='#9ca3af' stroke-width='1.2'/>
<text x='155' y='94' font-size='13' fill='#1f2937' text-anchor='middle' font-weight='bold'>Your development machine</text>
<rect x='50' y='108' width='210' height='74' rx='6' fill='#ffffff' stroke='#374151' stroke-width='1.2'/>
<text x='155' y='130' font-size='11' fill='#1f2937' text-anchor='middle' font-weight='normal'>authoring folder</text>
<text x='155' y='146' font-size='11' fill='#1f2937' text-anchor='middle' font-weight='normal'>branch develop</text>
<text x='155' y='162' font-size='11' fill='#1f2937' text-anchor='middle' font-weight='normal'>origin = PUBLIC only</text>
<rect x='370' y='70' width='200' height='60' rx='10' fill='#eef2ff' stroke='#4f46e5' stroke-width='1.2'/>
<text x='470' y='94' font-size='12' fill='#4f46e5' text-anchor='middle' font-weight='bold'>PUBLIC repository</text>
<text x='470' y='110' font-size='12' fill='#4f46e5' text-anchor='middle' font-weight='normal'>develop · beta · master</text>
<rect x='370' y='250' width='200' height='60' rx='10' fill='#fff1f2' stroke='#be123c' stroke-width='1.2'/>
<text x='470' y='274' font-size='12' fill='#be123c' text-anchor='middle' font-weight='bold'>PRIVATE repository</text>
<text x='470' y='290' font-size='12' fill='#be123c' text-anchor='middle' font-weight='normal'>develop · beta · master</text>
<rect x='660' y='70' width='250' height='380' rx='10' fill='#f9fafb' stroke='#9ca3af' stroke-width='1.2'/>
<text x='785' y='94' font-size='13' fill='#1f2937' text-anchor='middle' font-weight='bold'>The RHEL 8 VM</text>
<rect x='680' y='108' width='210' height='66' rx='6' fill='#ffffff' stroke='#374151' stroke-width='1.2'/>
<text x='785' y='128' font-size='11' fill='#1f2937' text-anchor='middle' font-weight='normal'>mirror folder</text>
<text x='785' y='143' font-size='11' fill='#1f2937' text-anchor='middle' font-weight='normal'>origin = private</text>
<text x='785' y='158' font-size='11' fill='#1f2937' text-anchor='middle' font-weight='normal'>+ remote &apos;public&apos; (fetch only)</text>
<rect x='680' y='190' width='210' height='96' rx='6' fill='#fff7ed' stroke='#d97706' stroke-width='1.2'/>
<text x='785' y='210' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>beta folder  (nr-nips-crucible-beta)</text>
<text x='785' y='225' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>branch beta · port 49161</text>
<text x='785' y='240' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>container crucible-py-beta</text>
<text x='785' y='255' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>its own data/ · certs/ · .env.local</text>
<text x='785' y='270' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>the testers</text>
<rect x='680' y='302' width='210' height='130' rx='6' fill='#eef2ff' stroke='#4f46e5' stroke-width='1.2'/>
<text x='785' y='322' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>production folder  (nr-nips-crucible)</text>
<text x='785' y='337' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>branch master · port 49160</text>
<text x='785' y='352' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>container crucible-py</text>
<text x='785' y='367' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>the real data/ · certs/ · .env.local</text>
<text x='785' y='382' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>the laboratory</text>
<text x='785' y='412' font-size='9.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>moves only by a promotion</text>
<line x1='282' y1='120' x2='368' y2='100' stroke='#4f46e5' stroke-width='1.6' marker-end='url(#arrow)'/>
<rect x='288' y='82' width='74' height='20' rx='4' fill='#ffffff' stroke='#4f46e5' stroke-width='1.2'/>
<text x='325' y='96' font-size='10' fill='#4f46e5' text-anchor='middle' font-weight='normal'>gate ✓ push</text>
<line x1='572' y1='100' x2='678' y2='136' stroke='#4f46e5' stroke-width='1.6' marker-end='url(#arrow)' stroke-dasharray='6 4'/>
<text x='628' y='108' font-size='10' fill='#6b7280' text-anchor='middle' font-weight='normal'>fetch public</text>
<line x1='678' y1='156' x2='572' y2='262' stroke='#be123c' stroke-width='1.6' marker-end='url(#arrow)'/>
<text x='600' y='200' font-size='10' fill='#6b7280' text-anchor='middle' font-weight='normal'>commit + push</text>
<line x1='572' y1='280' x2='678' y2='236' stroke='#d97706' stroke-width='1.6' marker-end='url(#arrow)' stroke-dasharray='6 4'/>
<text x='626' y='250' font-size='10' fill='#d97706' text-anchor='middle' font-weight='normal'>pull beta</text>
<line x1='572' y1='300' x2='678' y2='366' stroke='#be123c' stroke-width='1.6' marker-end='url(#arrow)' stroke-dasharray='6 4'/>
<text x='614' y='346' font-size='10' fill='#6b7280' text-anchor='middle' font-weight='normal'>pull master</text>
<text x='155' y='230' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal'>holds NO private credentials:</text>
<text x='155' y='246' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal'>it cannot push to the private repository</text>
<text x='470.0' y='458' font-size='12' fill='#1f2937' text-anchor='middle' font-weight='normal'>a fix found on the VM travels back as a patch, never a push — the arrow never runs right to left</text>
</svg>
