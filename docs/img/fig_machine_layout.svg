<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 940 400' width='940' height='400' role='img' aria-label='A Mac authoring folder pushes to the public repository; the VM&apos;s mirror folder fetches public and pushes private; the production folder pulls master from private' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>
<rect x='0.5' y='0.5' width='939' height='399' rx='12' fill='#ffffff' stroke='#e5e7eb'/>
<defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#9ca3af'/></marker></defs>
<text x='470.0' y='34' font-size='16' fill='#1f2937' text-anchor='middle' font-weight='bold'>Two repositories, three folders — content flows public → private only</text>
<rect x='30' y='70' width='250' height='130' rx='10' fill='#f9fafb' stroke='#9ca3af' stroke-width='1.2'/>
<text x='155' y='94' font-size='13' fill='#1f2937' text-anchor='middle' font-weight='bold'>Your Mac (or Windows PC)</text>
<rect x='50' y='108' width='210' height='74' rx='6' fill='#ffffff' stroke='#374151' stroke-width='1.2'/>
<text x='155' y='130' font-size='11' fill='#1f2937' text-anchor='middle' font-weight='normal'>authoring folder</text>
<text x='155' y='146' font-size='11' fill='#1f2937' text-anchor='middle' font-weight='normal'>branch develop</text>
<text x='155' y='162' font-size='11' fill='#1f2937' text-anchor='middle' font-weight='normal'>origin = PUBLIC only</text>
<rect x='370' y='70' width='200' height='60' rx='10' fill='#eef2ff' stroke='#4f46e5' stroke-width='1.2'/>
<text x='470' y='94' font-size='12' fill='#4f46e5' text-anchor='middle' font-weight='bold'>PUBLIC repository</text>
<text x='470' y='110' font-size='12' fill='#4f46e5' text-anchor='middle' font-weight='normal'>develop · beta · master</text>
<rect x='370' y='250' width='200' height='60' rx='10' fill='#fff1f2' stroke='#be123c' stroke-width='1.2'/>
<text x='470' y='274' font-size='12' fill='#be123c' text-anchor='middle' font-weight='bold'>PRIVATE repository</text>
<text x='470' y='290' font-size='12' fill='#be123c' text-anchor='middle' font-weight='normal'>develop · beta · master</text>
<rect x='660' y='70' width='250' height='300' rx='10' fill='#f9fafb' stroke='#9ca3af' stroke-width='1.2'/>
<text x='785' y='94' font-size='13' fill='#1f2937' text-anchor='middle' font-weight='bold'>The RHEL 8 VM (production)</text>
<rect x='680' y='110' width='210' height='80' rx='6' fill='#ffffff' stroke='#374151' stroke-width='1.2'/>
<text x='785' y='132' font-size='11' fill='#1f2937' text-anchor='middle' font-weight='normal'>mirror folder</text>
<text x='785' y='148' font-size='11' fill='#1f2937' text-anchor='middle' font-weight='normal'>origin = private</text>
<text x='785' y='164' font-size='11' fill='#1f2937' text-anchor='middle' font-weight='normal'>+ remote &apos;public&apos; (fetch only)</text>
<rect x='680' y='230' width='210' height='110' rx='6' fill='#ffffff' stroke='#374151' stroke-width='1.2'/>
<text x='785' y='252' font-size='11' fill='#1f2937' text-anchor='middle' font-weight='normal'>production folder</text>
<text x='785' y='268' font-size='11' fill='#1f2937' text-anchor='middle' font-weight='normal'>origin = private</text>
<text x='785' y='284' font-size='11' fill='#1f2937' text-anchor='middle' font-weight='normal'>branch master</text>
<text x='785' y='300' font-size='11' fill='#1f2937' text-anchor='middle' font-weight='normal'>the running container</text>
<text x='785' y='316' font-size='11' fill='#1f2937' text-anchor='middle' font-weight='normal'>data/ · certs/ · .env.local</text>
<line x1='282' y1='120' x2='368' y2='100' stroke='#4f46e5' stroke-width='1.6' marker-end='url(#arrow)'/>
<rect x='288' y='82' width='74' height='20' rx='4' fill='#ffffff' stroke='#4f46e5' stroke-width='1.2'/>
<text x='325' y='96' font-size='10' fill='#4f46e5' text-anchor='middle' font-weight='normal'>gate ✓ push</text>
<line x1='572' y1='100' x2='678' y2='140' stroke='#4f46e5' stroke-width='1.6' marker-end='url(#arrow)' stroke-dasharray='6 4'/>
<text x='628' y='108' font-size='10' fill='#6b7280' text-anchor='middle' font-weight='normal'>fetch public</text>
<line x1='678' y1='170' x2='572' y2='270' stroke='#be123c' stroke-width='1.6' marker-end='url(#arrow)'/>
<text x='610' y='236' font-size='10' fill='#6b7280' text-anchor='middle' font-weight='normal'>commit + push</text>
<line x1='572' y1='290' x2='678' y2='300' stroke='#be123c' stroke-width='1.6' marker-end='url(#arrow)' stroke-dasharray='6 4'/>
<text x='625' y='312' font-size='10' fill='#6b7280' text-anchor='middle' font-weight='normal'>pull master</text>
<text x='155' y='230' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal'>holds NO private credentials:</text>
<text x='155' y='246' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal'>it cannot push to the private repository</text>
<text x='470.0' y='388' font-size='12' fill='#1f2937' text-anchor='middle' font-weight='normal'>a fix found on the VM travels back as a patch, never a push — the arrow never runs right to left</text>
</svg>
