<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 940 400' width='940' height='400' role='img' aria-label='Three branch stations on one rail: develop, beta, master. Publish pushes develop to beta and the beta instance pulls it; promotion pushes beta to master and production pulls it, by hand' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>
<rect x='0.5' y='0.5' width='939' height='399' rx='12' fill='#ffffff' stroke='#e5e7eb'/>
<defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#9ca3af'/></marker></defs>
<text x='470.0' y='34' font-size='16' fill='#1f2937' text-anchor='middle' font-weight='bold'>Two moments, not one: publish reaches beta; promotion reaches production</text>
<line x1='90' y1='150' x2='850' y2='150' stroke='#9ca3af' stroke-width='3'/>
<circle cx='150' cy='150' r='14' fill='#ffffff' stroke='#374151' stroke-width='3'/>
<text x='150' y='112' font-size='14' fill='#374151' text-anchor='middle' font-weight='bold' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>develop</text>
<text x='150' y='128' font-size='10' fill='#6b7280' text-anchor='middle' font-weight='normal'>where every change is authored</text>
<circle cx='470' cy='150' r='14' fill='#ffffff' stroke='#d97706' stroke-width='3'/>
<text x='470' y='112' font-size='14' fill='#d97706' text-anchor='middle' font-weight='bold' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>beta</text>
<text x='470' y='128' font-size='10' fill='#6b7280' text-anchor='middle' font-weight='normal'>what the testers run</text>
<circle cx='790' cy='150' r='14' fill='#ffffff' stroke='#4f46e5' stroke-width='3'/>
<text x='790' y='112' font-size='14' fill='#4f46e5' text-anchor='middle' font-weight='bold' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>master</text>
<text x='790' y='128' font-size='10' fill='#6b7280' text-anchor='middle' font-weight='normal'>what the laboratory runs</text>
<rect x='200' y='168' width='220' height='54' rx='8' fill='#fff7ed' stroke='#d97706' stroke-width='1.2'/>
<text x='310' y='188' font-size='12' fill='#d97706' text-anchor='middle' font-weight='bold'>moment 1 — publish</text>
<text x='310' y='206' font-size='10' fill='#1f2937' text-anchor='middle' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>git push origin develop develop:beta</text>
<text x='310' y='240' font-size='9.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>every change, the same day · CI runs · the mirror copies it</text>
<rect x='520' y='168' width='220' height='54' rx='8' fill='#eef2ff' stroke='#4f46e5' stroke-width='1.2'/>
<text x='630' y='188' font-size='12' fill='#4f46e5' text-anchor='middle' font-weight='bold'>moment 2 — promote</text>
<text x='630' y='206' font-size='10' fill='#1f2937' text-anchor='middle' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>git push origin beta:master</text>
<text x='630' y='240' font-size='9.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>by hand, only when the testers agree · never automatic</text>
<rect x='360' y='262' width='220' height='62' rx='8' fill='#fff7ed' stroke='#d97706' stroke-width='1.2'/>
<text x='470' y='282' font-size='11.5' fill='#d97706' text-anchor='middle' font-weight='bold'>beta instance · port 49161</text>
<text x='470' y='300' font-size='10' fill='#1f2937' text-anchor='middle' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>git pull origin beta · rebuild</text>
<text x='470' y='316' font-size='9.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>testers</text>
<rect x='680' y='262' width='220' height='62' rx='8' fill='#eef2ff' stroke='#4f46e5' stroke-width='1.2'/>
<text x='790' y='282' font-size='11.5' fill='#4f46e5' text-anchor='middle' font-weight='bold'>production instance · port 49160</text>
<text x='790' y='300' font-size='10' fill='#1f2937' text-anchor='middle' font-weight='normal' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>backup · git pull origin master · rebuild</text>
<text x='790' y='316' font-size='9.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>the laboratory</text>
<line x1='470' y1='166' x2='470' y2='260' stroke='#d97706' stroke-width='1.6' marker-end='url(#arrow)' stroke-dasharray='6 4'/>
<line x1='790' y1='166' x2='790' y2='260' stroke='#4f46e5' stroke-width='1.6' marker-end='url(#arrow)' stroke-dasharray='6 4'/>
<circle cx='430' cy='338' r='4' fill='#d97706'/><path d='M 423 352 Q 430 342 437 352' fill='none' stroke='#d97706' stroke-width='2'/>
<circle cx='450' cy='338' r='4' fill='#d97706'/><path d='M 443 352 Q 450 342 457 352' fill='none' stroke='#d97706' stroke-width='2'/>
<circle cx='760' cy='338' r='4' fill='#4f46e5'/><path d='M 753 352 Q 760 342 767 352' fill='none' stroke='#4f46e5' stroke-width='2'/>
<circle cx='780' cy='338' r='4' fill='#4f46e5'/><path d='M 773 352 Q 780 342 787 352' fill='none' stroke='#4f46e5' stroke-width='2'/>
<circle cx='800' cy='338' r='4' fill='#4f46e5'/><path d='M 793 352 Q 800 342 807 352' fill='none' stroke='#4f46e5' stroke-width='2'/>
<circle cx='820' cy='338' r='4' fill='#4f46e5'/><path d='M 813 352 Q 820 342 827 352' fill='none' stroke='#4f46e5' stroke-width='2'/>
<text x='470.0' y='380' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>a change that fails on beta is simply never promoted; nothing is ever edited on the server</text>
</svg>
