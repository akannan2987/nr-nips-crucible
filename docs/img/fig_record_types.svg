<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 330' width='900' height='330' role='img' aria-label='The four record types: chemical, sample, screening, toxicology; the last three each point at one chemical' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>
<rect x='0.5' y='0.5' width='899' height='329' rx='12' fill='#ffffff' stroke='#e5e7eb'/>
<defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#9ca3af'/></marker></defs>
<text x='450.0' y='34' font-size='16' fill='#1f2937' text-anchor='middle' font-weight='bold'>The four record types, and how they hang off a chemical</text>
<rect x='10' y='60' width='160' height='170' rx='10' fill='#ffffff' stroke='#4f46e5' stroke-width='1.2'/>
<polygon points='90,80 107.32,90.0 107.32,110.0 90,120 72.68,110.0 72.68,90.0' fill='#4f46e5' fill-opacity='0.15' stroke='#4f46e5' stroke-width='2'/>
<text x='90' y='150' font-size='14' fill='#4f46e5' text-anchor='middle' font-weight='bold'>Chemical</text>
<text x='90' y='172' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal'>The substance, on paper:</text>
<text x='90' y='187' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal'>name, formula, CAS number</text>
<text x='90' y='202' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal'>(the anchor for the rest)</text>
<rect x='225' y='60' width='160' height='170' rx='10' fill='#ffffff' stroke='#0d9488' stroke-width='1.2'/>
<rect x='296.0' y='88.0' width='18.0' height='31.0' rx='6.0' fill='#0d9488' fill-opacity='0.15' stroke='#0d9488' stroke-width='2'/>
<rect x='299.0' y='81.0' width='12.0' height='8.0' fill='#0d9488'/>
<text x='305' y='150' font-size='14' fill='#0d9488' text-anchor='middle' font-weight='bold'>Sample</text>
<text x='305' y='172' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal'>A physical quantity in a vial:</text>
<text x='305' y='187' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal'>batch, concentration,</text>
<text x='305' y='202' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal'>location, expiry</text>
<rect x='440' y='60' width='160' height='170' rx='10' fill='#ffffff' stroke='#d97706' stroke-width='1.2'/>
<rect x='502.4' y='82.4' width='10.4' height='10.4' rx='2' fill='#d97706' fill-opacity='0.55' stroke='#d97706' stroke-width='1.2'/>
<rect x='502.4' y='94.80000000000001' width='10.4' height='10.4' rx='2' fill='#d97706' fill-opacity='0.15' stroke='#d97706' stroke-width='1.2'/>
<rect x='502.4' y='107.2' width='10.4' height='10.4' rx='2' fill='#d97706' fill-opacity='0.55' stroke='#d97706' stroke-width='1.2'/>
<rect x='514.8' y='82.4' width='10.4' height='10.4' rx='2' fill='#d97706' fill-opacity='0.15' stroke='#d97706' stroke-width='1.2'/>
<rect x='514.8' y='94.80000000000001' width='10.4' height='10.4' rx='2' fill='#d97706' fill-opacity='0.55' stroke='#d97706' stroke-width='1.2'/>
<rect x='514.8' y='107.2' width='10.4' height='10.4' rx='2' fill='#d97706' fill-opacity='0.15' stroke='#d97706' stroke-width='1.2'/>
<rect x='527.1999999999999' y='82.4' width='10.4' height='10.4' rx='2' fill='#d97706' fill-opacity='0.55' stroke='#d97706' stroke-width='1.2'/>
<rect x='527.1999999999999' y='94.80000000000001' width='10.4' height='10.4' rx='2' fill='#d97706' fill-opacity='0.15' stroke='#d97706' stroke-width='1.2'/>
<rect x='527.1999999999999' y='107.2' width='10.4' height='10.4' rx='2' fill='#d97706' fill-opacity='0.55' stroke='#d97706' stroke-width='1.2'/>
<text x='520' y='150' font-size='14' fill='#d97706' text-anchor='middle' font-weight='bold'>Screening</text>
<text x='520' y='172' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal'>The fast, broad first test:</text>
<text x='520' y='187' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal'>run a sample against an assay,</text>
<text x='520' y='202' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal'>record what happened</text>
<rect x='655' y='60' width='160' height='170' rx='10' fill='#ffffff' stroke='#be123c' stroke-width='1.2'/>
<rect x='715.0' y='84.0' width='40' height='32.0' rx='4' fill='#be123c' fill-opacity='0.12' stroke='#be123c' stroke-width='2'/>
<path d='M 718.0 112.0 C 733.0 112.0, 737.0 88.0, 752.0 88.0' fill='none' stroke='#be123c' stroke-width='2.2'/>
<text x='735' y='150' font-size='14' fill='#be123c' text-anchor='middle' font-weight='bold'>Toxicology study</text>
<text x='735' y='172' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal'>The slow, careful one:</text>
<text x='735' y='187' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal'>dose levels, endpoints,</text>
<text x='735' y='202' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal'>NOAEL</text>
<path d='M 305 236 L 305 262 L 90 262 L 90 236' fill='none' stroke='#4f46e5' stroke-width='1.6' marker-end='url(#arrow)'/>
<path d='M 520 236 L 520 262 L 90 262 L 90 236' fill='none' stroke='#4f46e5' stroke-width='1.6' marker-end='url(#arrow)'/>
<path d='M 735 236 L 735 262 L 90 262 L 90 236' fill='none' stroke='#4f46e5' stroke-width='1.6' marker-end='url(#arrow)'/>
<text x='450.0' y='292' font-size='12' fill='#1f2937' text-anchor='middle' font-weight='normal'>sample, screening and toxicology each point at ONE chemical — that pointer is the registry&apos;s whole value</text>
<text x='450.0' y='312' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal'>everyday version: one catalogue card per book; every loan slip, review and repair note is pinned to that card</text>
</svg>
