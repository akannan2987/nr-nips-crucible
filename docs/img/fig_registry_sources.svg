<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 940 420' width='940' height='420' role='img' aria-label='The Dotmatics export, the registry SDF and the limited list, each described as a template spec, feeding one registry through the shared import module' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>
<rect x='0.5' y='0.5' width='939' height='419' rx='12' fill='#ffffff' stroke='#e5e7eb'/>
<defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#9ca3af'/></marker></defs>
<text x='470.0' y='34' font-size='16' fill='#1f2937' text-anchor='middle' font-weight='bold'>Three real sources, one registry: each file is described as data, not parsed by hand</text>
<rect x='40' y='66' width='260' height='150' rx='10' fill='#ffffff' stroke='#d97706' stroke-width='1.2'/>
<text x='170' y='90' font-size='13' fill='#d97706' text-anchor='middle' font-weight='bold'>the Dotmatics export</text>
<text x='170' y='114' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>a spreadsheet, 115 columns</text>
<text x='170' y='129' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>one row per BATCH of a compound</text>
<text x='170' y='144' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>rows sharing REG_ID → one entry</text>
<text x='170' y='159' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>batches folded into a list</text>
<text x='170' y='200' font-size='10' fill='#6b7280' text-anchor='middle' font-weight='normal'>keyed on REG_ID, merges on DTXSID</text>
<path d='M 170 218 L 170 246 L 470 246 L 470 266' fill='none' stroke='#d97706' stroke-width='1.6' marker-end='url(#arrow)'/>
<rect x='340' y='66' width='260' height='150' rx='10' fill='#ffffff' stroke='#4f46e5' stroke-width='1.2'/>
<text x='470' y='90' font-size='13' fill='#4f46e5' text-anchor='middle' font-weight='bold'>the registry SDF</text>
<text x='470' y='114' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>V3000 structures, ~50 properties</text>
<text x='470' y='129' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>RDKit draws and checks each one</text>
<text x='470' y='144' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>same regulatory columns as the export</text>
<text x='470' y='159' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>merges with the export on DTXSID</text>
<text x='470' y='200' font-size='10' fill='#6b7280' text-anchor='middle' font-weight='normal'>the structure joins the identifiers</text>
<path d='M 470 218 L 470 246 L 470 246 L 470 266' fill='none' stroke='#4f46e5' stroke-width='1.6' marker-end='url(#arrow)'/>
<rect x='640' y='66' width='260' height='150' rx='10' fill='#ffffff' stroke='#0d9488' stroke-width='1.2'/>
<text x='770' y='90' font-size='13' fill='#0d9488' text-anchor='middle' font-weight='bold'>the limited list</text>
<text x='770' y='114' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>six columns</text>
<text x='770' y='129' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>NESTLE_ID = &apos;Coming from screening&apos;</text>
<text x='770' y='144' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>registered now, identifier later</text>
<text x='770' y='159' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>a standing notice until then</text>
<text x='770' y='200' font-size='10' fill='#6b7280' text-anchor='middle' font-weight='normal'>matched on CAS, then name</text>
<path d='M 770 218 L 770 246 L 470 246 L 470 266' fill='none' stroke='#0d9488' stroke-width='1.6' marker-end='url(#arrow)'/>
<rect x='250' y='268' width='440' height='80' rx='10' fill='#eef2ff' stroke='#4f46e5' stroke-width='1.2'/>
<text x='470' y='292' font-size='12.5' fill='#4f46e5' text-anchor='middle' font-weight='bold'>registry_templates.py — a spec per source</text>
<text x='470' y='312' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>fingerprint · group_by · match_order · promote · batch_fields</text>
<text x='470' y='326' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>promoted fields become the registry&apos;s own; EVERY column is kept under metadata</text>
<text x='470.0' y='376' font-size='11' fill='#1f2937' text-anchor='middle' font-weight='normal'>a shared CAS is kept and flagged · a batch that disagrees is flagged · a pending identifier is a notice — a person decides, the audit lists them</text>
<text x='470.0' y='398' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>everyday version: three suppliers deliver in three kinds of crate; the stockroom has one form per crate type, and nothing on the delivery note is thrown away</text>
</svg>
