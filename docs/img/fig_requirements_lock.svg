<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 940 330' width='940' height='330' role='img' aria-label='requirements.txt states version ranges; pip resolves them inside the Python 3.12 image into requirements.lock with exact versions; the Dockerfile, CI and the test environment all install from the lock' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>
<rect x='0.5' y='0.5' width='939' height='329' rx='12' fill='#ffffff' stroke='#e5e7eb'/>
<defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#9ca3af'/></marker></defs>
<text x='470.0' y='34' font-size='16' fill='#1f2937' text-anchor='middle' font-weight='bold'>What you asked for, and what you got — why there is a lock file</text>
<rect x='40' y='66' width='330' height='150' rx='10' fill='#ffffff' stroke='#0d9488' stroke-width='1.2'/>
<text x='205' y='92' font-size='13' fill='#0d9488' text-anchor='middle' font-weight='bold'>requirements.txt — the shopping list</text>
<text x='205' y='116' font-size='11.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>fastapi&gt;=0.115,&lt;1.0</text>
<text x='205' y='133' font-size='11.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>SQLAlchemy&gt;=2.0,&lt;3.0</text>
<text x='205' y='150' font-size='11.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>rdkit&gt;=2024.3.1</text>
<text x='205' y='167' font-size='11.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>… 12 lines, ranges: the INTENT</text>
<text x='205' y='202' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>edited by a person</text>
<line x1='372' y1='140' x2='428' y2='140' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arrow)'/>
<rect x='430' y='100' width='120' height='80' rx='8' fill='#f9fafb' stroke='#9ca3af' stroke-width='1.2'/>
<text x='490' y='126' font-size='11' fill='#374151' text-anchor='middle' font-weight='bold'>pip resolves</text>
<text x='490' y='141' font-size='11' fill='#374151' text-anchor='middle' font-weight='normal'>inside</text>
<text x='490' y='156' font-size='11' fill='#374151' text-anchor='middle' font-weight='normal'>python:3.12</text>
<text x='490' y='194' font-size='10' fill='#6b7280' text-anchor='middle' font-weight='normal' font-family='monospace'>./container-py.sh lock</text>
<line x1='552' y1='140' x2='608' y2='140' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arrow)'/>
<rect x='610' y='66' width='300' height='150' rx='10' fill='#eef2ff' stroke='#4f46e5' stroke-width='1.2'/>
<text x='760' y='92' font-size='13' fill='#4f46e5' text-anchor='middle' font-weight='bold'>requirements.lock — the receipt</text>
<text x='760' y='116' font-size='11.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>fastapi==0.141.1</text>
<text x='760' y='133' font-size='11.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>SQLAlchemy==2.0.x · rdkit==2025.9.3</text>
<text x='760' y='150' font-size='11.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>pydantic-core==… (a dependency&apos;s dependency)</text>
<text x='760' y='167' font-size='11.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>… 44 lines, exact: what was GOT</text>
<text x='760' y='202' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>generated, never edited by hand</text>
<path d='M 760 218 L 760 236 L 240 236 L 240 250' fill='none' stroke='#4f46e5' stroke-width='1.6' marker-end='url(#arrow)' stroke-dasharray='6 4'/>
<rect x='130' y='252' width='220' height='36' rx='6' fill='#ffffff' stroke='#be123c' stroke-width='1.2'/>
<text x='240' y='275' font-size='11.5' fill='#be123c' text-anchor='middle' font-weight='bold'>Dockerfile → the image</text>
<path d='M 760 218 L 760 236 L 540 236 L 540 250' fill='none' stroke='#4f46e5' stroke-width='1.6' marker-end='url(#arrow)' stroke-dasharray='6 4'/>
<rect x='430' y='252' width='220' height='36' rx='6' fill='#ffffff' stroke='#d97706' stroke-width='1.2'/>
<text x='540' y='275' font-size='11.5' fill='#d97706' text-anchor='middle' font-weight='bold'>CI on Linux + macOS</text>
<path d='M 760 218 L 760 250' fill='none' stroke='#4f46e5' stroke-width='1.6' marker-end='url(#arrow)' stroke-dasharray='6 4'/>
<rect x='730' y='252' width='220' height='36' rx='6' fill='#ffffff' stroke='#0d9488' stroke-width='1.2'/>
<text x='840' y='275' font-size='11.5' fill='#0d9488' text-anchor='middle' font-weight='bold'>backend/.venv for tests</text>
<text x='470.0' y='314' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal'>everyday version: the list says “bread, milk”; the receipt says exactly which loaf and which carton — and everyone gets the same receipt</text>
</svg>
