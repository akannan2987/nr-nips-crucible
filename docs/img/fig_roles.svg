<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 940 470' width='940' height='470' role='img' aria-label='Three roles as three badges, viewer, editor and admin, each including the one below; one rule from the verb and the path decides which badge a request needs; 403 names the role that was missing' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>
<rect x='0.5' y='0.5' width='939' height='469' rx='12' fill='#ffffff' stroke='#e5e7eb'/>
<defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#9ca3af'/></marker></defs>
<text x='470.0' y='34' font-size='16' fill='#1f2937' text-anchor='middle' font-weight='bold'>Three roles, one rule: the verb and the path say which badge a request needs</text>
<rect x='40' y='66' width='270' height='214' rx='12' fill='#f8fafc' stroke='#9ca3af' stroke-width='1.2'/>
<path d='M 76.5 85.1 Q 82 78.5 87.5 85.1' fill='none' stroke='#9ca3af' stroke-width='2'/>
<rect x='66.6' y='92.8' width='30.799999999999997' height='24.200000000000003' rx='2.6399999999999997' fill='#9ca3af' fill-opacity='0.16' stroke='#9ca3af' stroke-width='2'/>
<rect x='72.1' y='89.5' width='19.8' height='3.96' rx='1.1' fill='#9ca3af'/>
<text x='82' y='109.3' font-size='9.24' fill='#9ca3af' text-anchor='middle' font-weight='bold'>V</text>
<text x='120' y='100' font-size='14' fill='#9ca3af' text-anchor='start' font-weight='bold'>viewer</text>
<text x='120' y='118' font-size='10' fill='#6b7280' text-anchor='start' font-weight='normal'>Vera, who checks the numbers</text>
<text x='175' y='150' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>GET anything</text>
<text x='175' y='168' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>POST /api/query (a read)</text>
<text x='175' y='186' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>downloads and exports</text>
<text x='175' y='262' font-size='9.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>a step up includes every step below</text>
<line x1='312' y1='173' x2='333' y2='173' stroke='#374151' stroke-width='1.6' marker-end='url(#arrow)'/>
<rect x='335' y='66' width='270' height='214' rx='12' fill='#f0fdf4' stroke='#0d9488' stroke-width='1.2'/>
<path d='M 371.5 85.1 Q 377 78.5 382.5 85.1' fill='none' stroke='#0d9488' stroke-width='2'/>
<rect x='361.6' y='92.8' width='30.799999999999997' height='24.200000000000003' rx='2.6399999999999997' fill='#0d9488' fill-opacity='0.16' stroke='#0d9488' stroke-width='2'/>
<rect x='367.1' y='89.5' width='19.8' height='3.96' rx='1.1' fill='#0d9488'/>
<text x='377' y='109.3' font-size='9.24' fill='#0d9488' text-anchor='middle' font-weight='bold'>E</text>
<text x='415' y='100' font-size='14' fill='#0d9488' text-anchor='start' font-weight='bold'>editor</text>
<text x='415' y='118' font-size='10' fill='#6b7280' text-anchor='start' font-weight='normal'>Ed, who loads the files</text>
<text x='470' y='150' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>everything a viewer may</text>
<text x='470' y='168' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>POST · PUT: upload, create, edit</text>
<text x='470' y='186' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>link and unlink rows</text>
<text x='470' y='204' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>review marks, set an identifier</text>
<text x='470' y='262' font-size='9.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>a step up includes every step below</text>
<line x1='607' y1='173' x2='628' y2='173' stroke='#374151' stroke-width='1.6' marker-end='url(#arrow)'/>
<rect x='630' y='66' width='270' height='214' rx='12' fill='#eef2ff' stroke='#4f46e5' stroke-width='1.2'/>
<path d='M 666.5 85.1 Q 672 78.5 677.5 85.1' fill='none' stroke='#4f46e5' stroke-width='2'/>
<rect x='656.6' y='92.8' width='30.799999999999997' height='24.200000000000003' rx='2.6399999999999997' fill='#4f46e5' fill-opacity='0.16' stroke='#4f46e5' stroke-width='2'/>
<rect x='662.1' y='89.5' width='19.8' height='3.96' rx='1.1' fill='#4f46e5'/>
<text x='672' y='109.3' font-size='9.24' fill='#4f46e5' text-anchor='middle' font-weight='bold'>A</text>
<text x='710' y='100' font-size='14' fill='#4f46e5' text-anchor='start' font-weight='bold'>admin</text>
<text x='710' y='118' font-size='10' fill='#6b7280' text-anchor='start' font-weight='normal'>Ada, who runs the instance</text>
<text x='765' y='150' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>everything an editor may</text>
<text x='765' y='168' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>DELETE anything</text>
<text x='765' y='186' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>bulk delete · merge · clear all</text>
<text x='765' y='204' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>the accounts (from the terminal)</text>
<text x='765' y='262' font-size='9.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>a step up includes every step below</text>
<rect x='40' y='300' width='860' height='96' rx='10' fill='#fffbeb' stroke='#d97706' stroke-width='1.2'/>
<text x='470' y='322' font-size='11.5' fill='#d97706' text-anchor='middle' font-weight='bold' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>required_role(method, path), in backend/app/auth.py, applied by the one guard on every router</text>
<text x='470' y='344' font-size='10' fill='#1f2937' text-anchor='middle' font-weight='normal'>GET, HEAD, OPTIONS → viewer  |  POST /api/query → viewer (a read)  |  any other POST, PUT, PATCH → editor</text>
<text x='470' y='361' font-size='10' fill='#1f2937' text-anchor='middle' font-weight='normal'>DELETE → admin  |  POST …/bulk/delete, …/merge, …/all/clear → admin</text>
<text x='470' y='378' font-size='10' fill='#1f2937' text-anchor='middle' font-weight='normal'>the answer when the badge is too low: 403 {"error": "Forbidden: this needs the admin role (yours: editor)"}</text>
<rect x='40' y='410' width='860' height='26' rx='6' fill='#f9fafb' stroke='#374151' stroke-width='1.2'/>
<text x='470' y='427' font-size='10' fill='#1f2937' text-anchor='middle' font-weight='bold'>with the login off, or on the token rung, every caller is an admin: the rule never refuses, and nothing that worked before changes</text>
<text x='470.0' y='456' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>everyday version: a visitor badge opens the corridors, a staff badge the labs, a keyholder badge the stockroom and the alarm panel</text>
</svg>
