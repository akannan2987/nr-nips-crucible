<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 940 230' width='940' height='230' role='img' aria-label='Four one-time setup steps, then a five-step loop for every change' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>
<rect x='0.5' y='0.5' width='939' height='229' rx='12' fill='#ffffff' stroke='#e5e7eb'/>
<defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#9ca3af'/></marker></defs>
<text x='470.0' y='34' font-size='16' fill='#1f2937' text-anchor='middle' font-weight='bold'>Set up once per machine, then a short loop forever</text>
<rect x='30' y='70' width='150' height='56' rx='8' fill='#ffffff' stroke='#0d9488' stroke-width='1.2'/>
<text x='105' y='92' font-size='12' fill='#0d9488' text-anchor='middle' font-weight='bold'>install the runtime</text>
<text x='105' y='112' font-size='10' fill='#6b7280' text-anchor='middle' font-weight='normal'>podman or Docker</text>
<line x1='182' y1='98' x2='196' y2='98' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arrow)'/>
<rect x='198' y='70' width='150' height='56' rx='8' fill='#ffffff' stroke='#0d9488' stroke-width='1.2'/>
<text x='273' y='92' font-size='12' fill='#0d9488' text-anchor='middle' font-weight='bold'>clone</text>
<text x='273' y='112' font-size='10' fill='#6b7280' text-anchor='middle' font-weight='normal'>the public repository</text>
<line x1='350' y1='98' x2='364' y2='98' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arrow)'/>
<rect x='366' y='70' width='150' height='56' rx='8' fill='#ffffff' stroke='#0d9488' stroke-width='1.2'/>
<text x='441' y='92' font-size='12' fill='#0d9488' text-anchor='middle' font-weight='bold'>one command</text>
<text x='441' y='112' font-size='10' fill='#6b7280' text-anchor='middle' font-weight='normal'>./setup-after-clone-py.sh</text>
<line x1='518' y1='98' x2='532' y2='98' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arrow)'/>
<rect x='534' y='70' width='150' height='56' rx='8' fill='#ffffff' stroke='#0d9488' stroke-width='1.2'/>
<text x='609' y='92' font-size='12' fill='#0d9488' text-anchor='middle' font-weight='bold'>checklist</text>
<text x='609' y='112' font-size='10' fill='#6b7280' text-anchor='middle' font-weight='normal'>V1–V7 / V1–V9</text>
<text x='357' y='150' font-size='11' fill='#0d9488' text-anchor='middle' font-weight='bold'>ONCE — never again on this machine</text>
<line x1='706' y1='98' x2='722' y2='98' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arrow)'/>
<rect x='724' y='62' width='190' height='74' rx='10' fill='#eef2ff' stroke='#4f46e5' stroke-width='1.2'/>
<text x='819' y='86' font-size='13' fill='#4f46e5' text-anchor='middle' font-weight='bold'>the loop</text>
<text x='819' y='106' font-size='11' fill='#1f2937' text-anchor='middle' font-weight='normal'>edit → test → rebuild →</text>
<text x='819' y='121' font-size='11' fill='#1f2937' text-anchor='middle' font-weight='normal'>verify → publish</text>
<text x='819' y='150' font-size='11' fill='#4f46e5' text-anchor='middle' font-weight='bold'>EVERY change, minutes each</text>
<text x='470.0' y='190' font-size='12' fill='#1f2937' text-anchor='middle' font-weight='normal'>the loop never needs the install guide again: it fits on the handbook&apos;s cheat sheet</text>
<text x='470.0' y='210' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal'>everyday version: fit the kitchen once; after that, cooking is the same short routine every evening</text>
</svg>
