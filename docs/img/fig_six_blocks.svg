<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 940 470' width='940' height='470' role='img' aria-label='Six blocks in two rows: publish (development machine commit and push, mirror copy and push, beta folder pull and rebuild) then, after the testers agree, promote (development machine push beta to master, mirror the same and the sync check, production folder backup, pull and rebuild)' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>
<rect x='0.5' y='0.5' width='939' height='469' rx='12' fill='#ffffff' stroke='#e5e7eb'/>
<defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#9ca3af'/></marker></defs>
<text x='470.0' y='34' font-size='15' fill='#1f2937' text-anchor='middle' font-weight='bold'>Every change travels the same six blocks: three to reach the testers, three to reach the laboratory</text>
<text x='160' y='66' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='bold'>Development machine, your folder</text>
<text x='470' y='66' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='bold'>VM, mirror folder</text>
<text x='780' y='66' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='bold'>VM, instance folder</text>
<text x='40' y='92' font-size='11' fill='#d97706' text-anchor='start' font-weight='bold'>moment 1: publish, every change</text>
<rect x='40' y='100' width='240' height='104' rx='10' fill='#fff7ed' stroke='#d97706' stroke-width='1.2'/>
<circle cx='62' cy='122' r='13' fill='#d97706'/>
<text x='62' y='127' font-size='13' fill='#ffffff' text-anchor='middle' font-weight='bold'>1</text>
<text x='168' y='127' font-size='12' fill='#d97706' text-anchor='middle' font-weight='bold'>commit, push, tag</text>
<text x='160' y='150' font-size='9.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>git commit</text>
<text x='160' y='165' font-size='9.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>git push origin develop develop:beta</text>
<text x='160' y='180' font-size='9.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>git tag -a vX.Y.Z</text>
<text x='160' y='195' font-size='9.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>the public repository has it</text>
<rect x='350' y='100' width='240' height='104' rx='10' fill='#fff7ed' stroke='#d97706' stroke-width='1.2'/>
<circle cx='372' cy='122' r='13' fill='#d97706'/>
<text x='372' y='127' font-size='13' fill='#ffffff' text-anchor='middle' font-weight='bold'>2</text>
<text x='478' y='127' font-size='12' fill='#d97706' text-anchor='middle' font-weight='bold'>copy into the private repo</text>
<text x='470' y='150' font-size='9.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>git fetch public</text>
<text x='470' y='165' font-size='9.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>git checkout public/develop -- .</text>
<text x='470' y='180' font-size='9.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>commit · tag · push develop develop:beta</text>
<text x='470' y='195' font-size='9.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>the private repository has it</text>
<rect x='660' y='100' width='240' height='104' rx='10' fill='#fff7ed' stroke='#d97706' stroke-width='1.2'/>
<circle cx='682' cy='122' r='13' fill='#d97706'/>
<text x='682' y='127' font-size='13' fill='#ffffff' text-anchor='middle' font-weight='bold'>3</text>
<text x='788' y='127' font-size='12' fill='#d97706' text-anchor='middle' font-weight='bold'>beta runs it</text>
<text x='780' y='150' font-size='9.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>cd nr-nips-crucible-beta</text>
<text x='780' y='165' font-size='9.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>git pull --ff-only origin beta</text>
<text x='780' y='180' font-size='9.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>./container-py.sh rebuild  (if code changed)</text>
<text x='780' y='195' font-size='9.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>the testers see it</text>
<line x1='282' y1='152' x2='348' y2='152' stroke='#d97706' stroke-width='1.6' marker-end='url(#arrow)'/>
<line x1='592' y1='152' x2='658' y2='152' stroke='#d97706' stroke-width='1.6' marker-end='url(#arrow)'/>
<line x1='40' y1='236' x2='900' y2='236' stroke='#9ca3af' stroke-width='1.2' stroke-dasharray='6 4'/>
<text x='470.0' y='231' font-size='10' fill='#6b7280' text-anchor='middle' font-weight='normal'>the testers use it: minutes for a label, days for a login; a change that fails here is never promoted</text>
<text x='40' y='262' font-size='11' fill='#4f46e5' text-anchor='start' font-weight='bold'>moment 2: promote, when the testers agree</text>
<rect x='40' y='270' width='240' height='104' rx='10' fill='#eef2ff' stroke='#4f46e5' stroke-width='1.2'/>
<circle cx='62' cy='292' r='13' fill='#4f46e5'/>
<text x='62' y='297' font-size='13' fill='#ffffff' text-anchor='middle' font-weight='bold'>4</text>
<text x='168' y='297' font-size='12' fill='#4f46e5' text-anchor='middle' font-weight='bold'>declare it good</text>
<text x='160' y='320' font-size='9.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>git fetch origin</text>
<text x='160' y='335' font-size='9.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>git push origin origin/beta:master</text>
<text x='160' y='350' font-size='9.5' fill='#1f2937' text-anchor='middle' font-weight='normal'></text>
<text x='160' y='365' font-size='9.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>public master moves</text>
<rect x='350' y='270' width='240' height='104' rx='10' fill='#eef2ff' stroke='#4f46e5' stroke-width='1.2'/>
<circle cx='372' cy='292' r='13' fill='#4f46e5'/>
<text x='372' y='297' font-size='13' fill='#ffffff' text-anchor='middle' font-weight='bold'>5</text>
<text x='478' y='297' font-size='12' fill='#4f46e5' text-anchor='middle' font-weight='bold'>the same, private side</text>
<text x='470' y='320' font-size='9.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>git push origin origin/beta:master</text>
<text x='470' y='335' font-size='9.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>git diff --stat public/develop develop</text>
<text x='470' y='350' font-size='9.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>(only the six workbooks)</text>
<text x='470' y='365' font-size='9.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>private master moves</text>
<rect x='660' y='270' width='240' height='104' rx='10' fill='#eef2ff' stroke='#4f46e5' stroke-width='1.2'/>
<circle cx='682' cy='292' r='13' fill='#4f46e5'/>
<text x='682' y='297' font-size='13' fill='#ffffff' text-anchor='middle' font-weight='bold'>6</text>
<text x='788' y='297' font-size='12' fill='#4f46e5' text-anchor='middle' font-weight='bold'>production runs it</text>
<text x='780' y='320' font-size='9.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>cd nr-nips-crucible · backup</text>
<text x='780' y='335' font-size='9.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>git pull --ff-only origin master</text>
<text x='780' y='350' font-size='9.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>./container-py.sh rebuild  (if code changed)</text>
<text x='780' y='365' font-size='9.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>the laboratory sees it</text>
<line x1='282' y1='322' x2='348' y2='322' stroke='#4f46e5' stroke-width='1.6' marker-end='url(#arrow)'/>
<line x1='592' y1='322' x2='658' y2='322' stroke='#4f46e5' stroke-width='1.6' marker-end='url(#arrow)'/>
<text x='470.0' y='408' font-size='10' fill='#6b7280' text-anchor='middle' font-weight='normal'>what changes between releases: whether blocks 3 and 6 rebuild (code) or only pull (documents), and how long the pause lasts</text>
<text x='470.0' y='428' font-size='10' fill='#6b7280' text-anchor='middle' font-weight='normal'>the detailed steps with expected output: 03-git-workflow.md, Flow A · everyday version: a recipe is written at home, copied into the</text>
<text x='470.0' y='446' font-size='10' fill='#6b7280' text-anchor='middle' font-weight='normal'>restaurant&apos;s book, cooked in the practice kitchen; when the trainees approve, it is marked approved in both places and the restaurant cooks it</text>
</svg>
