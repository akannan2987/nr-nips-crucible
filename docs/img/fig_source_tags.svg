<text x='470.0' y='34' font-size='16' fill='#1f2937' text-anchor='middle' font-weight='bold'>Source tags (CR-11): derived from what the entry records, never stored; filter by all of them or any</text>
<rect x='30' y='66' width='560' height='200' rx='10' fill='#f9fafb' stroke='#9ca3af' stroke-width='1.2'/>
<text x='310' y='88' font-size='12' fill='#1f2937' text-anchor='middle' font-weight='bold'>four entries and the tags each carries</text>
<polygon points='52,106 59.794,110.5 59.794,119.5 52,124 44.206,119.5 44.206,110.5' fill='#4f46e5' fill-opacity='0.15' stroke='#4f46e5' stroke-width='2'/>
<text x='66' y='119' font-size='10.5' fill='#1f2937' text-anchor='start' font-weight='normal'>CHEM-000001  caffeine, from the export</text>
