<text x='463.20000000000005' y='119' font-size='9.5' fill='#059669' text-anchor='middle' font-weight='bold'>Excel upload</text>
<polygon points='52,144 59.794,148.5 59.794,157.5 52,162 44.206,157.5 44.206,148.5' fill='#4f46e5' fill-opacity='0.15' stroke='#4f46e5' stroke-width='2'/>
<text x='66' y='157' font-size='10.5' fill='#1f2937' text-anchor='start' font-weight='normal'>CHEM-000002  vanillin, export + structure file</text>
<rect x='330' y='144' width='84.80000000000001' height='18' rx='9' fill='#4f46e522' stroke='#4f46e5' stroke-width='1'/>
<text x='372.4' y='157' font-size='9.5' fill='#4f46e5' text-anchor='middle' font-weight='bold'>Dotmatics ID</text>
