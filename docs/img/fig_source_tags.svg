<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 940 400' width='940' height='400' role='img' aria-label='Four registry entries with their source tags, the two readings of a multi-tag filter, and the strip of batch counts' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>
