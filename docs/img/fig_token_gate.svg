<text x='400' y='262' font-size='12' fill='#d97706' text-anchor='middle' font-weight='bold' font-family='ui-monospace,SFMono-Regular,Menlo,monospace'>require_user</text>
<text x='400' y='280' font-size='9.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>compares in constant time</text>
<text x='400' y='293' font-size='9.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>AUTH_MODE=token</text>
