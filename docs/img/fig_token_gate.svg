<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 940 500' width='940' height='500' role='img' aria-label='Three callers meet one guard in front of every module: a browser with a cookie and a script with a bearer header pass, anyone else gets 401; health, instance and the login routes stay open' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>
<rect x='0.5' y='0.5' width='939' height='499' rx='12' fill='#ffffff' stroke='#e5e7eb'/>
<defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#9ca3af'/></marker></defs>
<text x='470.0' y='34' font-size='16' fill='#1f2937' text-anchor='middle' font-weight='bold'>The token gate (SH-3a): one guard in front of every module, three doors that stay open</text>
<rect x='30' y='74' width='230' height='78' rx='10' fill='#ffffff' stroke='#4f46e5' stroke-width='1.2'/>
<text x='145' y='94' font-size='12' fill='#4f46e5' text-anchor='middle' font-weight='bold'>a person, in the browser</text>
<text x='145' y='114' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>pasted the token once</text>
<text x='145' y='129' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>cookie on every request</text>
<line x1='262' y1='113' x2='322' y2='250' stroke='#4f46e5' stroke-width='1.6' marker-end='url(#arrow)'/>
<rect x='30' y='164' width='230' height='78' rx='10' fill='#ffffff' stroke='#0d9488' stroke-width='1.2'/>
<text x='145' y='184' font-size='12' fill='#0d9488' text-anchor='middle' font-weight='bold'>a script, or curl</text>
<text x='145' y='204' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>Authorization: Bearer &lt;token&gt;</text>
<text x='145' y='219' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>on every request</text>
<line x1='262' y1='203' x2='322' y2='250' stroke='#0d9488' stroke-width='1.6' marker-end='url(#arrow)'/>
<rect x='30' y='254' width='230' height='78' rx='10' fill='#ffffff' stroke='#be123c' stroke-width='1.2'/>
<text x='145' y='274' font-size='12' fill='#be123c' text-anchor='middle' font-weight='bold'>anyone else</text>
<text x='145' y='294' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>no token</text>
<text x='145' y='309' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>answer: 401 Not authenticated</text>
<line x1='262' y1='293' x2='322' y2='250' stroke='#9ca3af' stroke-width='1.6' marker-end='url(#arrow)' stroke-dasharray='6 4'/>
<path d='M 284 252 L 296 264 M 296 252 L 284 264' stroke='#be123c' stroke-width='2.4' fill='none'/>
<rect x='325' y='186' width='150' height='128' rx='12' fill='#fffbeb' stroke='#d97706' stroke-width='1.2'/>
