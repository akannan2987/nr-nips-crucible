<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 940 430' width='940' height='430' role='img' aria-label='Production and beta on one server: two folders, two containers, two ports; publish reaches beta, promotion reaches production, data is copied one way on request' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif'>
<rect x='0.5' y='0.5' width='939' height='429' rx='12' fill='#ffffff' stroke='#e5e7eb'/>
<defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto-start-reverse'><path d='M 0 0 L 10 5 L 0 10 z' fill='#9ca3af'/></marker></defs>
<text x='470.0' y='34' font-size='16' fill='#1f2937' text-anchor='middle' font-weight='bold'>Two instances on one server (SH-12): production keeps the real data; testers get a copy on beta</text>
<rect x='30' y='120' width='150' height='90' rx='10' fill='#f9fafb' stroke='#9ca3af' stroke-width='1.2'/>
<text x='105' y='148' font-size='13' fill='#1f2937' text-anchor='middle' font-weight='bold'>Mac</text>
<text x='105' y='170' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>author on develop</text>
<text x='105' y='185' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>publish · promote</text>
<rect x='230' y='66' width='680' height='300' rx='12' fill='#ffffff' stroke='#9ca3af' stroke-width='1.2' stroke-dasharray='6 4'/>
<text x='570' y='88' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>the server — one machine, two folders, two containers, two ports</text>
<rect x='260' y='110' width='290' height='120' rx='10' fill='#fff7ed' stroke='#d97706' stroke-width='1.2'/>
<text x='405' y='134' font-size='13' fill='#d97706' text-anchor='middle' font-weight='bold'>beta instance</text>
<text x='405' y='156' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>folder nr-nips-crucible-beta · branch beta</text>
<text x='405' y='171' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>container crucible-py-beta · port 49161</text>
<text x='405' y='186' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>its own database: a copy of production&apos;s</text>
<text x='405' y='218' font-size='9.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>testers log in here · nothing reaches production</text>
<rect x='590' y='110' width='290' height='120' rx='10' fill='#eef2ff' stroke='#4f46e5' stroke-width='1.2'/>
<text x='735' y='134' font-size='13' fill='#4f46e5' text-anchor='middle' font-weight='bold'>production instance</text>
<text x='735' y='156' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>folder nr-nips-crucible · branch master</text>
<text x='735' y='171' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>container crucible-py · port 49160</text>
<text x='735' y='186' font-size='10.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>the real database</text>
<text x='735' y='218' font-size='9.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>the laboratory · moves only by promotion</text>
<line x1='182' y1='150' x2='258' y2='150' stroke='#d97706' stroke-width='1.6' marker-end='url(#arrow)'/>
<text x='220' y='142' font-size='9.5' fill='#d97706' text-anchor='middle' font-weight='normal'>publish</text>
<path d='M 552 150 L 588 150' fill='none' stroke='#4f46e5' stroke-width='1.6' marker-end='url(#arrow)'/>
<text x='570' y='142' font-size='9.5' fill='#4f46e5' text-anchor='middle' font-weight='normal'>promote</text>
<path d='M 735 232 L 735 290 L 405 290 L 405 232' fill='none' stroke='#4f46e5' stroke-width='1.6' marker-end='url(#arrow)' stroke-dasharray='6 4'/>
<text x='570' y='306' font-size='9.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>a copy of the data, one way, when you ask: backup on production, restore on beta</text>
<rect x='260' y='322' width='620' height='30' rx='6' fill='#f9fafb' stroke='#9ca3af' stroke-width='1.2'/>
<text x='570' y='342' font-size='9.5' fill='#1f2937' text-anchor='middle' font-weight='normal'>shared: the same container-py.sh (told its instance name), the same certificate (it names the host, not the port), the same setup guide</text>
<text x='470.0' y='392' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>everyday version: the practice kitchen next to the restaurant kitchen — same equipment, a copy of tonight&apos;s ingredients,</text>
<text x='470.0' y='410' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal'>and whatever a trainee burns there, no customer eats</text>
</svg>
